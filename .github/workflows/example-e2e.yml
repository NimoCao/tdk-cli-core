name: 🧪 Default example E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: ./.github/workflows/docs-only.yml # zizmor: ignore[self-repository] reusable workflow resolves from this commit, not the job filesystem
    permissions:
      contents: read
      pull-requests: read

  example-e2e:
    name: example-e2e
    runs-on: ubuntu-latest
    needs: docs
    # Skip on docs-only PRs; a skipped job still satisfies required checks.
    if: ${{ !cancelled() && needs.docs.outputs.docs_only != 'true' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      - name: Free required host ports
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' >/dev/null 2>&1 || true
          sudo fuser -k 80/tcp 443/tcp 5432/tcp 2>/dev/null || true

      - name: Build and pack the candidate TDK package
        run: |
          bun install --frozen-lockfile
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Pack and install the candidate TDK package
        run: | # zizmor: ignore[adhoc-packages] installs our own freshly packed tarball
          tarball="$(npm pack --silent | tail -1)"
          npm install --global "./$tarball"

      - name: Clone and configure the bundled example
        run: |
          tdk project example --path tdk-example
          cd tdk-example
          tdk project --yes
          # The product example intentionally uses only PostgreSQL and NATS.
          # Keep its scaffold from enabling optional Infisical resources.
          sed -i 's/^INFISICAL_ENABLED=.*/INFISICAL_ENABLED=false/' .env
          tdk doctor --no-ping
          tdk config verify

      - name: Boot, health check, and prove the routed worker write path
        working-directory: tdk-example
        shell: bash
        run: |
          set -euo pipefail
          tdk up shop > up.log 2>&1 &
          tdk_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Example E2E failed; collecting container and NATS logs before teardown"
              tail -160 up.log 2>/dev/null || true
              jq '{errors, ports: .data.ports}' doctor.json 2>/dev/null || true
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
              docker logs tdk_example_nats 2>&1 | tail -200 || true
              tilt get uiresources -o json 2>&1 | jq -r '.items[] | "\(.metadata.name): update=\(.status.updateStatus // "-") runtime=\(.status.runtimeStatus // "-") error=\((.status.buildHistory // [] | map(.error // empty) | first) // "-")"' || true
            fi
            kill "$tdk_pid" 2>/dev/null || true
            tdk down >/dev/null 2>&1 || true
            return "$status"
          }
          trap cleanup EXIT

          for _ in $(seq 1 75); do
            if grep -q 'Running tilt up' up.log; then break; fi
            if ! kill -0 "$tdk_pid" 2>/dev/null; then tail -120 up.log; exit 1; fi
            sleep 2
          done
          if ! grep -q 'Running tilt up' up.log; then tail -120 up.log; exit 1; fi

          # TDK chooses ingress ports from the available host ports and saves
          # the selected plan. Read the public machine-readable doctor report
          # instead of assuming Traefik is bound to port 80.
          doctor_status=0
          tdk doctor --json > doctor.json || doctor_status=$?
          if [ "$doctor_status" -ne 0 ]; then
            echo "tdk doctor reported readiness findings while the example was starting; reading its saved port plan anyway."
          fi
          http_port="$(jq -er '.data.ports.http.chosen | select(type == "number")' doctor.json)"
          api="http://api.tdk-example.localhost:${http_port}/api/orders"
          app="http://app.tdk-example.localhost:${http_port}/orders-app/"
          for _ in $(seq 1 90); do
            if curl -fsS "$api/health" >/dev/null 2>&1 && curl -fsS "$api/worker-ready" >/dev/null 2>&1 && curl -fsS "$app" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "$api/health" >/dev/null
          curl -fsS "$api/worker-ready" >/dev/null
          curl -fsS "$app" >/dev/null

          order_id="$(curl -fsS -X POST "$api" -H 'content-type: application/json' \
            -d '{"item":"CI coffee"}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).order.id)))')"
          echo "Created order $order_id through Traefik"

          observed=false
          for _ in $(seq 1 60); do
            result="$(curl -fsS "$api/$order_id")"
            seen="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).order.workerSeenAt ? "yes" : "no"))')"
            if [ "$seen" = yes ]; then observed=true; break; fi
            sleep 1
          done
          if [ "$observed" != true ]; then
            echo "Worker did not observe order $order_id" >&2
            docker logs tdk_example_nats || true
            tail -120 up.log
            exit 1
          fi
          echo "NATS worker observed order $order_id"
          tdk config verify

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          if [ ! -d tdk-example ]; then exit 0; fi
          cd tdk-example
          tail -160 up.log 2>/dev/null || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          docker logs tdk_example_nats 2>&1 | tail -200 || true

      - name: Stop example
        if: always()
        run: |
          if [ -d tdk-example ]; then
            cd tdk-example
            tdk down || true
          fi
