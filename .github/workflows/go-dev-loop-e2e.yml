name: Go dev loop E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engine/topologies/platform/docker/dockerfile/language_dockerfile.star"
      - "engine/topologies/tilt/resources/orchestrator/apply_compose_resource_registration.star"
      - "scripts/e2e/go-dev-loop.sh"
      - "scripts/e2e/go-dev-loop-probe.py"
      - ".github/workflows/go-dev-loop-e2e.yml"

permissions:
  contents: read

concurrency:
  group: go-dev-loop-e2e${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-dev-loop:
    name: Go live reload through tdk up and Traefik
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Tilt
        run: |
          curl -fsSL -o tilt.tgz https://github.com/tilt-dev/tilt/releases/download/v0.37.8/tilt.0.37.8.linux.x86_64.tar.gz
          echo "e39513f958705d30524d55f68b1d46fbef2b46a0da568efd00e6383dee6be44f  tilt.tgz" | sha256sum -c -
          if [ "$(id -u)" -eq 0 ]; then tar -xzf tilt.tgz -C /usr/local/bin tilt; else sudo tar -xzf tilt.tgz -C /usr/local/bin tilt; fi
          rm -f tilt.tgz

      # ubuntu-latest ships a Postgres service already listening on 5432, which fails tdk doctor's host-port check.
      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::error::port 5432 is still in use after purging postgresql"
            exit 1
          fi

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      # Edits the scaffolded service, breaks it, fixes it and touches go.mod, and fails if the app is down for a whole compile,
      # the compiler error is missing from the Tilt log, or a dependency change does not rebuild the image.
      - name: Run the Go dev loop check
        run: scripts/e2e/go-dev-loop.sh 5
