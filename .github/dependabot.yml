# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️ "
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️ "
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
